name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Le modèle HY-MT 1,25 bit a besoin du noyau STQ1_0, proposé dans la PR #22836 de llama.cpp.
      # On fige le commit pour que le build reste reproductible.
      - name: Récupérer llama.cpp (PR 22836)
        run: |
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin 1e411d8f5a1e23525fa3265dfb4bd76265465397 \
            || git fetch --depth 1 origin pull/22836/head
          git checkout --detach FETCH_HEAD
          git log --oneline -1

      - name: Installer le NDK et CMake
        run: |
          set +e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
            yes | "$SDKMANAGER" --licenses
            "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-37"
          } > sdk.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=sdkmanager::$(tail -c 2500 sdk.log | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Compiler l'APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Erreurs de compilation (annotations)
        if: failure()
        run: |
          grep -n -E "error:|FAILED|What went wrong|Caused by|CMake Error|undefined reference|fatal error" -A3 build.log | head -60 > errors.log || true
          echo "::error title=build::$(tail -c 3500 errors.log | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dtrad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dtrad-apk
          path: Dtrad.apk

      - name: Publier dans les Releases (lien de téléchargement stable)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Dtrad.apk \
            --title "Dtrad (dernière version)" \
            --notes "APK installable directement (signé avec la clé debug). Commit ${GITHUB_SHA::7}."
